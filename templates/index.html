<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>University Course Recommendation</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>University Course Recommendation System</h1>

    <p>
        Select a student to receive personalized
        course recommendations.
    </p>

    <form action="/recommend"
          method="POST">

        <label for="student_id">
            Select Student
        </label>

        <select name="student_id"
                id="student_id"
                required>

            <option value="">
                -- Select Student --
            </option>

            {% for student in students %}

            <option value="{{ student.student_id }}">

                {{ student.student_id }}
                -
                {{ student.name }}

            </option>

            {% endfor %}

        </select>

        <button type="submit">
            Recommend Courses
        </button>

    </form>

</div>

</body>

</html>
